name: PNMF data-independent checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tracked-source-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r projects/pnmf/requirements.txt
      - name: Compile and import tracked source
        working-directory: projects/pnmf
        run: |
          python -m compileall -q pnmf pnmf_cli.py tests/test_ci_smoke.py
          python -c "import pnmf; from pnmf.models import SUPPORTED_LEARNERS; assert SUPPORTED_LEARNERS == ('et', 'rf')"
      - name: Synthetic smoke tests (no ANP corpus)
        working-directory: projects/pnmf
        run: python -m pytest tests/test_ci_smoke.py -q
      - name: Full-data boundary
        shell: pwsh
        run: |
          Write-Host "GitHub CI intentionally excludes ignored ANP sources, SQLite, and outputs."
          Write-Host "Run the full local suite and validate-model with provisioned ANP data."
          Write-Host "Current full-data evidence: projects/pnmf/docs/MODEL_TRAINING_REPORT.md"
