# Codex project bootstrap — Efe
# Primary session: GPT-5.6 Sol xhigh orchestrator
# Dynamically spawned subagents: GPT-5.6 Luna max

model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
max_depth = 2

[features]
multi_agent = true
hooks = true

[windows]
sandbox = "unelevated"

# Managed by LazyCodex:
# multi_agent_v2 is intentionally disabled because enabling it currently
# causes HTTP 400 errors in your setup.
[features.multi_agent_v2]
max_concurrent_threads_per_session = 16
